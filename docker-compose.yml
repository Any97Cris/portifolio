services:
  app:
    build:
      context: .
      dockerfile: .docker/Dockerfile
    container_name: jigsaw-app-portifolio
    working_dir: /app
    volumes:
      - .:/app
    ports:
      - "9000:9000"
      - "3000:3000"
    environment:
      - PHP_IDE_CONFIG=serverName=localhost
    networks:
      - jigsaw-network
    tty: true

  nginx:
    image: nginx:alpine
    container_name: jigsaw-nginx-portifolio
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - .:/app
      - ./.docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - jigsaw-network

networks:
  jigsaw-network:
    driver: bridge
